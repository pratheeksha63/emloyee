<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Portal — Sign In</title>
  <meta name="description" content="Acme Corp internal employee portal login." />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
<div class="page-center">
  <div class="card">

    <!-- Logo -->
    <div class="logo-wrap">
      <div class="logo-icon">&#128736;</div>
      <div class="logo-text">
        <h1>Acme Corp</h1>
        <span>Employee Portal</span>
      </div>
    </div>

    <p class="card-title">Welcome back</p>
    <p class="card-sub">Sign in to access your workspace.</p>

    <!-- Error area — shown only when error is set -->
    {% if error %}
    <div class="alert-error" id="login-error" role="alert">
      <span>&#9888;</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <!-- Login form -->
    <form method="POST" action="{{ url_for('login') }}" id="login-form" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input
          class="form-control"
          type="text"
          id="username"
          name="username"
          placeholder="Enter your username"
          maxlength="120"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input
          class="form-control"
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          maxlength="120"
          required
        />
      </div>

      <button class="btn-primary" type="submit" id="login-submit">Sign In</button>
    </form>

    <hr class="divider" />

    <p class="footer-note">Authorised personnel only &mdash; all access is logged.</p>
  </div>
</div>
</body>
</html>
